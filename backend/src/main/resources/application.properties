# Server settings
server.port=${PORT:8080}
server.servlet.context-path=

# PostgreSQL Connection Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_SERVER:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:graceconnect}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security & JWT Configuration
# Note: Keep jwt.secret long and secure (at least 256-bit base64/plain string).
graceconnect.jwt.secret=${JWT_SECRET:9a4f2c8d3e7b1a5f6c8d9e0a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c}
# 1 Day in milliseconds: 86400000
graceconnect.jwt.expirationMs=86400000

# File Upload limits (just in case)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger UI and API Docs configs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
